server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /dashboard { return 301 /dashboard/; }
  location /dashboard/ {
    rewrite ^/dashboard/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
}
