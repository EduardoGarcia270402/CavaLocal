apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      containers:
        - name: audit
          image: cavalocal-audit:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3002 }
          env:
            - { name: PORT, valueFrom: { configMapKeyRef: { name: cavalocal-config, key: AUDIT_PORT } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: cavalocal-secrets, key: AUDIT_DATABASE_URL } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: cavalocal-secrets, key: RABBITMQ_URL } } }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 75m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  selector: { app: audit-service }
  ports:
    - { name: http, port: 3002, targetPort: http }
