apiVersion: apps/v1
kind: Deployment
metadata:
  name: cavalocal-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: cavalocal-web }
  template:
    metadata:
      labels: { app: cavalocal-web }
    spec:
      containers:
        - name: web
          image: cavalocal-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector: { app: cavalocal-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: audit-dashboard }
  template:
    metadata:
      labels: { app: audit-dashboard }
    spec:
      containers:
        - name: dashboard
          image: cavalocal-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector: { app: audit-dashboard }
  ports:
    - { name: http, port: 8080, targetPort: http }
